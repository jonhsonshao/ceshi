<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一号基金池 | NewEra新纪元</title>
<!-- 替换为Ethers V5，弃用web3.js v4 -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
}
:root{
    --era-blue:#00b8ff;
    --era-purple:#924cff;
    --main-gradient:linear-gradient(90deg,#00b8ff,#924cff);
}
body{
    background:#05050c;
    background-image:
        radial-gradient(circle at 15% 15%, rgba(10, 20, 70, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(5, 35, 60, 0.3) 0%, transparent 45%);
    min-height:100vh;
    color:#e8edff;
    overflow-x:hidden;
}
.header-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:16px 32px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(8,8,16,0.6);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.06);
    z-index:99;
}
.logo-wrap{
    display:flex;
    align-items:center;
    gap:14px;
}
.logo-text{
    font-size:22px;
    font-weight:600;
    background:var(--main-gradient);
    -webkit-background-clip:text;
    color:transparent;
    letter-spacing:1px;
}
.header-right{
    display:flex;
    align-items:center;
    gap:20px;
    max-width:50%;
    justify-content:flex-end;
}
.wallet-box{
    padding:6px 10px;
    border-radius:8px;
    border:1px solid rgba(0,184,255,0.3);
    color:var(--era-blue);
    background:rgba(0,184,255,0.08);
    font-size:12px;
    cursor:pointer;
    transition:0.25s;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:220px;
}
.wallet-box:hover{
    box-shadow:0 0 12px rgba(0,184,255,0.25);
}
.menu-trigger{
    width:42px;
    height:42px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.05);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    cursor:pointer;
    transition:0.25s;
    flex-shrink:0;
}
.menu-trigger:hover{
    border-color:rgba(146,76,255,0.4);
}
.menu-trigger span{
    width:22px;
    height:2px;
    background:#d0d8ff;
    border-radius:1px;
    transition:0.3s;
}
.side-nav{
    position:fixed;
    top:80px;
    right:-320px;
    width:300px;
    background:rgba(12,12,26,0.85);
    backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px 0 0 16px;
    padding:30px;
    transition:right 0.35s ease;
    z-index:98;
}
.side-nav.open{
    right:0;
}
.side-nav h3{
    font-size:18px;
    margin-bottom:24px;
    color:#fff;
    padding-bottom:12px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}
.nav-item{
    display:block;
    width:100%;
    padding:14px 16px;
    margin-bottom:10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.06);
    background:rgba(255,255,255,0.03);
    text-align:left;
    font-size:15px;
    cursor:pointer;
    transition:0.25s;
}
.nav-item:nth-child(2){color:var(--era-blue);}
.nav-item:nth-child(3){color:#b388ff;}
.nav-item:nth-child(4){color:#66e8c0;}
.nav-item:nth-child(5){color:#ffc460;}
.nav-item:hover{
    background:rgba(255,255,255,0.08);
    border-color:rgba(255,255,255,0.15);
}

.main-wrap{
    max-width:900px;
    margin:0 auto;
    padding:140px 20px 60px;
}
.back-btn{
    display:inline-block;
    margin-bottom:24px;
    padding:8px 16px;
    border:1px solid rgba(0,184,255,0.35);
    border-radius:8px;
    color:var(--era-blue);
    cursor:pointer;
    background:rgba(0,184,255,0.06);
}
.pool-card{
    background:rgba(12,12,24,0.65);
    backdrop-filter:blur(10px);
    border-radius:22px;
    padding:40px;
    border:1px solid rgba(0,184,255,0.14);
}
.pool-card h1{
    font-size:28px;
    color:var(--era-blue);
    margin-bottom:20px;
}
.rule-block{
    margin:24px 0;
    line-height:2;
    color:#cbd4f0;
    font-size:16px;
}
.subscribe-box{
    margin-top:36px;
    padding:28px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.07);
    background:rgba(255,255,255,0.02);
    text-align:center;
}
.amount-text{
    font-size:20px;
    margin-bottom:24px;
    color:#fff;
}
.subscribe-btn{
    padding:14px 40px;
    border-radius:12px;
    border:none;
    font-size:16px;
    cursor:pointer;
    background:var(--main-gradient);
    color:#fff;
    box-shadow:0 0 16px rgba(0,184,255,0.3);
    transition:0.25s;
}
.subscribe-btn:disabled{
    opacity:0.45;
    cursor:not-allowed;
}
.subscribe-btn:hover:not(:disabled){
    box-shadow:0 0 24px rgba(0,184,255,0.45);
}
.tip-text{
    margin-top:16px;
    font-size:14px;
    color:#8897c2;
}
.modal-mask{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
}
.modal-box{
    width:90%;
    max-width:420px;
    background:#111122;
    border:1px solid rgba(0,184,255,0.25);
    border-radius:16px;
    padding:32px;
}
.modal-box h3{
    margin-bottom:18px;
    color:#fff;
}
.modal-desc{
    line-height:1.8;
    color:#cbd4f0;
    margin-bottom:26px;
}
.modal-buttons{
    display:flex;
    gap:14px;
}
.modal-cancel,.modal-confirm{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:15px;
    cursor:pointer;
}
.modal-cancel{
    background:#2a2a44;
    color:#fff;
}
.modal-confirm{
    background:var(--main-gradient);
    color:#fff;
}
.already-tip{
    color:#66e8c0;
    font-size:15px;
    margin-top:12px;
}

@media(max-width:540px){
    .header-bar{padding:12px 16px;}
    .logo-text{font-size:17px;}
    .header-right{max-width:50%;gap:10px;}
    .wallet-box{font-size:11px;padding:5px 8px;max-width:140px;}
    .pool-card{padding:22px 18px;}
    .pool-card h1{font-size:22px;}
    .rule-block{font-size:14px;}
    .side-nav{width:calc(100% - 20px);right:calc(-100% + 10px);}
}
</style>
</head>
<body>
<header class="header-bar">
    <div class="logo-wrap">
        <div class="logo-text">NewEra</div>
    </div>
    <div class="header-right">
        <div class="wallet-box" id="walletBtn">连接钱包</div>
        <div class="menu-trigger" id="menuBtn">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</header>

<div class="side-nav" id="sideMenu">
    <h3>导航菜单</h3>
    <div class="nav-item">代币兑换</div>
    <div class="nav-item">流动性池</div>
    <div class="nav-item">质押挖矿</div>
    <div class="nav-item">收益查询</div>
</div>

<div class="main-wrap">
    <div class="back-btn" id="goHomeBtn">← 返回首页</div>
    <div class="pool-card">
        <h1>一号基金池｜创始基金会</h1>
        <div class="rule-block">
            <p>🔹 基金池总量：5000 万枚 NewEra</p>
            <p>🔹 锁仓周期：锁仓 2 年</p>
            <p>🔹 释放规则：2 年锁仓结束后，每月 5% 线性释放</p>
            <p>🔹 认购档位：固定 100 USDT / 份</p>
        </div>

        <div class="subscribe-box">
            <div class="amount-text">认购金额：<strong>100 USDT</strong></div>
            <button class="subscribe-btn" id="buyBtn">立即认购</button>
            <div class="tip-text" id="statusTip"></div>
        </div>
    </div>
</div>

<div class="modal-mask" id="confirmModal">
    <div class="modal-box">
        <h3>确认认购一号基金池</h3>
        <div class="modal-desc">
            将支付 <b>100 USDT</b> 参与一号基金池认购<br>
        </div>
        <div class="modal-buttons">
            <button class="modal-cancel" id="modalCancel">取消</button>
            <button class="modal-confirm" id="modalOk">确认认购</button>
        </div>
    </div>
</div>

<script>
const menuBtn = document.getElementById('menuBtn');
const sideMenu = document.getElementById('sideMenu');
menuBtn.onclick = function(){
    sideMenu.classList.toggle('open');
}

document.getElementById("goHomeBtn").onclick = function(){
    window.location.href = "./index.html";
}

const walletBtn = document.getElementById("walletBtn");
let provider;
let signer = null;
let currentAccount = null;
const BSC_CHAIN_ID = 56n;
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const RECEIVE_ADDR = "0xaD8BdEf075C651eBadB0ffC0023B167d9211ed21";
// ✅100 USDT，6位小数 BigInt，ethers原生支持BigInt，不会编码错乱
const BUY_AMOUNT = 100n * 10n**6n;

const usdtAbi = [
    "function transfer(address to, uint256 value) external returns (bool)"
];

function formatAddress(addr){
    if(!addr) return "";
    return addr.slice(0,6)+"****"+addr.slice(-4);
}
function updateWalletUI(){
    if(currentAccount){
        walletBtn.innerText = formatAddress(currentAccount);
    }else{
        walletBtn.innerText = "连接钱包";
    }
    refreshSubscribeStatus();
}

async function switchBSC(){
    try{
        await provider.send("wallet_switchEthereumChain", [{chainId:"0x38"}]);
    }catch(e){console.error(e);}
}

async function autoConnectWallet(){
    if(!window.ethereum) return;
    provider = new ethers.providers.Web3Provider(window.ethereum);
    const accounts = await provider.send("eth_accounts",[]);
    if(accounts.length>0){
        currentAccount = accounts[0];
        signer = provider.getSigner();
        await switchBSC();
        updateWalletUI();
    }
}

walletBtn.onclick = async function(){
    if(currentAccount){
        navigator.clipboard.writeText(currentAccount);
        alert("已复制地址："+currentAccount);
        return;
    }
    if(!window.ethereum){
        alert("未检测钱包，请安装TP/MetaMask");
        return;
    }
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();
    currentAccount = await signer.getAddress();
    await switchBSC();
    updateWalletUI();
}

if(window.ethereum){
    window.ethereum.on("accountsChanged", async (accounts)=>{
        if(accounts.length>0){
            currentAccount = accounts[0];
            signer = provider.getSigner();
        }else{
            currentAccount = null;
            signer = null;
        }
        updateWalletUI();
    })
}

function getLocalSubscribeRecord(){
    if(!currentAccount) return false;
    const key = "pool1_sub_"+currentAccount.toLowerCase();
    return localStorage.getItem(key) === "1";
}
function setLocalSubscribeRecord(){
    const key = "pool1_sub_"+currentAccount.toLowerCase();
    localStorage.setItem(key,"1");
}
function refreshSubscribeStatus(){
    const buyBtn = document.getElementById("buyBtn");
    const tipDom = document.getElementById("statusTip");
    if(!currentAccount){
        buyBtn.disabled = true;
        tipDom.innerText = "请先连接BSC钱包";
        return;
    }
    if(getLocalSubscribeRecord()){
        buyBtn.disabled = true;
        tipDom.innerHTML = "<span class='already-tip'>✅ 本地记录：该钱包已完成一号基金池认购</span>";
    }else{
        buyBtn.disabled = false;
        tipDom.innerText = "";
    }
}

const modal = document.getElementById("confirmModal");
const buyBtn = document.getElementById("buyBtn");
const modalCancel = document.getElementById("modalCancel");
const modalOk = document.getElementById("modalOk");

buyBtn.onclick = function(){
    if(!currentAccount){
        alert("请先连接钱包");
        return;
    }
    modal.style.display = "flex";
}
modalCancel.onclick = function(){
    modal.style.display = "none";
}

modalOk.onclick = async function(){
    modal.style.display = "none";
    try{
        const usdtContract = new ethers.Contract(USDT_CONTRACT, usdtAbi, signer);
        // ethers5 原生支持BigInt，ABI编码不会乱，TP钱包显示正确100USDT
        const tx = await usdtContract.transfer(RECEIVE_ADDR, BUY_AMOUNT);
        alert("交易已提交！TxHash："+tx.hash+"\n等待链上确认");
        await tx.wait();
        setLocalSubscribeRecord();
        alert("✅交易确认成功");
        refreshSubscribeStatus();
    }catch(err){
        console.error(err);
        alert("交易失败/用户拒绝签名："+err.message);
    }
}

window.onload = function(){
    autoConnectWallet();
}
</script>
</body>
</html>
